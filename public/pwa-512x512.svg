<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with smooth rounded edges -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Playful Decorative Stars / Dots -->
  <circle cx="100" cy="110" r="14" fill="#FDE047" opacity="0.8" />
  <circle cx="410" cy="120" r="18" fill="#6EE7B7" opacity="0.8" />
  <circle cx="90" cy="380" r="12" fill="#F472B6" opacity="0.8" />
  <circle cx="420" cy="400" r="16" fill="#FDE047" opacity="0.8" />

  <!-- Sound Waves (Left & Right) -->
  <!-- Left Waves -->
  <path d="M 160 210 A 60 60 0 0 0 160 302" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 125 180 A 100 100 0 0 0 125 332" stroke="#A5B4FC" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Right Waves -->
  <path d="M 352 210 A 60 60 0 0 1 352 302" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 387 180 A 100 100 0 0 1 387 332" stroke="#A5B4FC" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Center Microphone Body -->
  <g filter="url(#shadow)">
    <!-- Mic Capsule -->
    <rect x="216" y="140" width="80" height="150" rx="40" fill="url(#micGrad)" />
    
    <!-- Mic Grid Lines -->
    <line x1="228" y1="190" x2="284" y2="190" stroke="#D97706" stroke-width="5" stroke-linecap="round" />
    <line x1="228" y1="220" x2="284" y2="220" stroke="#D97706" stroke-width="5" stroke-linecap="round" />
    
    <!-- Cradle / Arc -->
    <path d="M 196 230 A 60 60 0 0 0 316 230" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none" />
    
    <!-- Stem and Stand Base -->
    <line x1="256" y1="290" x2="256" y2="350" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
    <path d="M 206 350 L 306 350" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
  </g>

  <!-- Smile on Microphone to make it friendly -->
  <path d="M 244 252 Q 256 264 268 252" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="238" cy="242" r="3.5" fill="#78350F" />
  <circle cx="274" cy="242" r="3.5" fill="#78350F" />
</svg>
