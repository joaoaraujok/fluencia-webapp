services:
  postgres:
    image: postgres:16-alpine
    container_name: fluencia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluenciadb
    ports:
      - "5432:5432"
    volumes:
      - fluencia_pgdata:/var/lib/postgresql/data

volumes:
  fluencia_pgdata:
    driver: local
